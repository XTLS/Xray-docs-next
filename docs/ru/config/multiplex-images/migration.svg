<svg xmlns="http://www.w3.org/2000/svg" width="510" height="160" viewBox="0 0 510 160" role="img">
  <title>Старый mux удалить, multiplex добавить в settings</title>
  <style>
    .context { fill: #59636e; }
    @media (prefers-color-scheme: dark) { .context { fill: #aeb8c4; } }
  </style>
  <text x="16" y="25" font-family="monospace" font-size="15" xml:space="preserve" class="context">  "protocol": "vless",</text>
  <rect x="2" y="32" width="506" height="24" fill="#ffe4e6"/>
  <rect x="2" y="32" width="4" height="24" fill="#cf303d"/>
  <text x="16" y="49" font-family="monospace" font-size="15" xml:space="preserve" fill="#881337">  "mux": { "enabled": true },</text>
  <text x="16" y="73" font-family="monospace" font-size="15" xml:space="preserve" class="context">  "settings": {</text>
  <rect x="2" y="80" width="506" height="24" fill="#dcfce7"/>
  <rect x="2" y="80" width="4" height="24" fill="#238636"/>
  <text x="16" y="97" font-family="monospace" font-size="15" xml:space="preserve" fill="#14532d">    "multiplex": { "concurrency": 8 },</text>
  <text x="16" y="121" font-family="monospace" font-size="15" xml:space="preserve" class="context">    "address": "proxy.example.com",</text>
  <text x="16" y="145" font-family="monospace" font-size="15" xml:space="preserve" class="context">    …</text>
</svg>
