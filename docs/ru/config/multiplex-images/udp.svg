<svg xmlns="http://www.w3.org/2000/svg" width="510" height="184" viewBox="0 0 510 184" role="img">
  <title>Положение поля multiplex в settings</title>
  <style>
    .context { fill: #59636e; }
    @media (prefers-color-scheme: dark) { .context { fill: #aeb8c4; } }
  </style>
  <text x="16" y="25" font-family="monospace" font-size="15" xml:space="preserve" class="context">  "settings": {</text>
  <rect x="2" y="32" width="506" height="24" fill="#dcfce7"/>
  <rect x="2" y="32" width="4" height="24" fill="#238636"/>
  <text x="16" y="49" font-family="monospace" font-size="15" xml:space="preserve" fill="#14532d">    "multiplex": {</text>
  <rect x="2" y="56" width="506" height="24" fill="#dcfce7"/>
  <rect x="2" y="56" width="4" height="24" fill="#238636"/>
  <text x="16" y="73" font-family="monospace" font-size="15" xml:space="preserve" fill="#14532d">      "xudpConcurrency": 16,</text>
  <rect x="2" y="80" width="506" height="24" fill="#dcfce7"/>
  <rect x="2" y="80" width="4" height="24" fill="#238636"/>
  <text x="16" y="97" font-family="monospace" font-size="15" xml:space="preserve" fill="#14532d">      "xudpProxyUDP443": "allow"</text>
  <rect x="2" y="104" width="506" height="24" fill="#dcfce7"/>
  <rect x="2" y="104" width="4" height="24" fill="#238636"/>
  <text x="16" y="121" font-family="monospace" font-size="15" xml:space="preserve" fill="#14532d">    },</text>
  <text x="16" y="145" font-family="monospace" font-size="15" xml:space="preserve" class="context">    "address": "proxy.example.com",</text>
  <text x="16" y="169" font-family="monospace" font-size="15" xml:space="preserve" class="context">    …</text>
</svg>
